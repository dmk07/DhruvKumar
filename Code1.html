<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Studora · Student Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins','Segoe UI',sans-serif}
:root{--bg:#0b1020;--card:rgba(255,255,255,.06);--border:rgba(255,255,255,.13);--text:#eef1fb;--muted:#94a1c2;
--shadow:0 14px 34px rgba(0,0,0,.4);--g1:#7c6cff;--g2:#3ddad7;--g3:#fd79a8;--ok:#69db7c;--warn:#ffd43b;--bad:#ff6b81}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(100px);opacity:.35;z-index:-1;animation:drift 18s infinite alternate ease-in-out}
.blob1{width:420px;height:420px;background:#6c5ce7;top:-120px;left:-100px}
.blob2{width:380px;height:380px;background:#00d2c6;bottom:-140px;right:-80px;animation-delay:-6s}
.blob3{width:280px;height:280px;background:#fd79a8;top:35%;left:60%;animation-delay:-12s}
@keyframes drift{to{transform:translate(60px,40px) scale(1.15)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:300% 0}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes pulseRing{0%,100%{box-shadow:0 0 0 0 rgba(255,77,109,.5)}50%{box-shadow:0 0 0 9px rgba(255,77,109,0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-16px) rotate(5deg)}}
@keyframes dots{0%,80%,100%{transform:scale(.4);opacity:.4}40%{transform:scale(1);opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes fixIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--border);border-radius:18px;backdrop-filter:blur(12px)}
.grad-text{background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3),var(--g1));background-size:300% 100%;
-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.btn{border:none;border-radius:12px;padding:11px 20px;font-weight:700;font-size:.9rem;cursor:pointer;color:#fff;
background:linear-gradient(120deg,var(--g1),#5a8bff);transition:transform .2s,box-shadow .2s;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(124,108,255,.45)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn.danger{background:linear-gradient(120deg,#ff6b81,#ff4d6d)}
.btn.small{padding:6px 12px;font-size:.78rem;border-radius:9px}
.inp{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.07);
color:var(--text);outline:none;font-size:.9rem;font-family:inherit;transition:box-shadow .25s}
.inp:focus{box-shadow:0 0 0 3px rgba(124,108,255,.35)}
select.inp option{background:#141a33;color:#eef1fb}
label.fl{font-size:.72rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);display:block;margin:12px 0 5px}
.muted{color:var(--muted)}

/* ---------- HOME ---------- */
.topnav{display:flex;justify-content:space-between;align-items:center;padding:20px 6vw}
.logo{font-size:1.6rem;font-weight:800;letter-spacing:.5px}
.logo small{display:block;font-size:.62rem;font-weight:500;color:var(--muted);letter-spacing:2.5px;-webkit-text-fill-color:var(--muted)}
.hero{text-align:center;padding:7vh 6vw 5vh;animation:fadeUp .8s ease both}
.hero h1{font-size:clamp(2rem,5.5vw,3.4rem);line-height:1.15;margin-bottom:14px}
.hero p{color:var(--muted);max-width:560px;margin:0 auto 28px}
.hero .emo{position:absolute;font-size:1.9rem;animation:floaty 5s ease-in-out infinite;pointer-events:none}
.cta-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.ticker{overflow:hidden;white-space:nowrap;margin:34px 0;animation:fadeUp 1s .2s both}
.ticker-track{display:inline-flex;gap:12px;padding-left:12px;animation:marquee 24s linear infinite}
.bchip{padding:8px 18px;border-radius:999px;font-size:.8rem;font-weight:600;border:1px solid var(--border);background:var(--card)}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;padding:0 6vw 40px;max-width:1100px;margin:0 auto}
.feat{padding:22px;border-radius:18px;transition:transform .25s;animation:pop .6s ease both}
.feat:hover{transform:translateY(-6px) scale(1.02)}
.feat .ic{font-size:1.9rem;margin-bottom:10px;display:inline-block;animation:bob 3s ease-in-out infinite}
.feat h3{font-size:1rem;margin-bottom:6px}
.feat p{font-size:.8rem;color:var(--muted)}
footer{text-align:center;padding:26px;color:var(--muted);font-size:.78rem}

/* ---------- AUTH ---------- */
.center-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-box{width:100%;max-width:420px;padding:30px;animation:pop .5s ease both}
.seg{display:flex;gap:6px;background:rgba(255,255,255,.06);padding:5px;border-radius:12px;margin-bottom:8px}
.seg button{flex:1;padding:9px;border:none;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;cursor:pointer;font-family:inherit;transition:all .25s}
.seg button.on{background:linear-gradient(120deg,var(--g1),#5a8bff);color:#fff}

/* ---------- DASHBOARD ---------- */
.dash{display:flex;gap:22px;max-width:1200px;margin:0 auto;padding:24px 20px 60px}
.side{width:235px;min-width:235px;padding:20px;display:flex;flex-direction:column;gap:14px;align-self:flex-start;position:sticky;top:20px;animation:fadeUp .5s ease both}
.uchip{display:flex;gap:12px;align-items:center}
.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.15rem;color:#fff;background:linear-gradient(135deg,var(--uc,#7c6cff),#fd79a8);flex-shrink:0}
.uchip b{font-size:.92rem;display:block}.uchip small{font-size:.68rem;color:var(--muted)}
.side nav{display:flex;flex-direction:column;gap:6px}
.navbtn{text-align:left;padding:10px 13px;border-radius:11px;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:600;font-size:.86rem;cursor:pointer;font-family:inherit;transition:all .22s;position:relative}
.navbtn:hover{color:var(--text);background:rgba(255,255,255,.05)}
.navbtn.active{background:linear-gradient(120deg,var(--g1),#5a8bff);color:#fff;box-shadow:0 6px 16px rgba(124,108,255,.35)}
.dot{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:#ff4d6d;color:#fff;font-size:.62rem;font-weight:800;min-width:18px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.main{flex:1;min-width:0;animation:fadeUp .5s .1s ease both}
.announce{background:linear-gradient(120deg,rgba(255,212,59,.16),rgba(255,107,129,.14));border:1px solid rgba(255,212,59,.4);
padding:12px 16px;border-radius:14px;margin-bottom:18px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:.86rem}
.announce button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem}
h2.pt{margin:4px 0 18px;font-size:1.3rem;animation:pop .4s ease both}
h2.pt span{font-size:.8rem;color:var(--muted);font-weight:500;margin-left:8px}

/* timetable */
.daytabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:8px 15px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-weight:600;font-size:.8rem;cursor:pointer;transition:all .25s;font-family:inherit}
.tab:hover{transform:translateY(-2px);color:var(--text)}
.tab.active{background:linear-gradient(120deg,var(--g1),#5a8bff);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(124,108,255,.4)}
.next-banner{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
background:linear-gradient(120deg,rgba(124,108,255,.22),rgba(61,218,215,.16));border:1px solid var(--border);
border-radius:16px;padding:16px 20px;margin-bottom:20px}
.next-banner h4{font-size:.68rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:3px}
#countdown{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.cls{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:15px;
padding:14px 16px 14px 20px;margin-bottom:11px;position:relative;overflow:hidden;transition:transform .22s;animation:pop .45s ease both;animation-delay:var(--d)}
.cls::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.cls:hover{transform:translateY(-3px)}
.cls.now{border-color:rgba(255,77,109,.45)}
.live{font-size:.58rem;font-weight:800;letter-spacing:1px;color:#fff;background:#ff4d6d;padding:3px 9px;border-radius:999px;animation:pulseRing 1.4s infinite}
.t-start{font-weight:800}.t-end{font-size:.72rem;color:var(--muted)}
.cls h3{font-size:.95rem;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.cls p{font-size:.78rem;color:var(--muted);margin-top:2px}

/* attendance */
.att-sum{display:flex;gap:12px;align-items:center;padding:15px 18px;margin-bottom:16px;font-weight:600;font-size:.9rem}
.att-row{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:12px;animation:pop .45s ease both;animation-delay:var(--d);flex-wrap:wrap}
.ring{width:74px;height:74px;flex-shrink:0}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bgc{stroke:rgba(255,255,255,.09)}
.ring text{fill:var(--text);font-weight:800;font-size:15px;font-family:'Poppins'}
.ring .fg{transform:rotate(-90deg);transform-origin:40px 40px;transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)}
.att-info{flex:1;min-width:150px}
.att-info h3{font-size:.95rem}.att-info p{font-size:.76rem;color:var(--muted);margin-top:3px}
.counts{display:flex;gap:14px;font-size:.8rem;margin-top:6px}
.counts b{font-size:.95rem}
.att-acts{display:flex;gap:7px;flex-wrap:wrap}
.pill{font-size:.62rem;font-weight:800;letter-spacing:1px;padding:3px 10px;border-radius:999px}
.p-ok{background:rgba(105,219,124,.18);color:var(--ok)}.p-warn{background:rgba(255,212,59,.15);color:var(--warn)}.p-bad{background:rgba(255,107,129,.16);color:var(--bad)}

/* cgpa */
.cg-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;animation:pop .35s both}
.cg-row .inp{flex:1}
.cg-row button{flex-shrink:0}
.cg-big{font-size:2.7rem;font-weight:800}
.gauge{height:14px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:10px 0 6px}
.gauge div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .9s cubic-bezier(.4,0,.2,1)}

/* calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal-head h3{font-size:1.05rem}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-grid .wd{text-align:center;font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:5px 0}
.cal-cell{aspect-ratio:1;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:.82rem;
background:rgba(255,255,255,.045);border:1px solid transparent;cursor:pointer;transition:all .2s;font-family:inherit;color:var(--text)}
.cal-cell:hover{background:rgba(255,255,255,.12)}
.cal-cell.today{border-color:var(--g2)}
.cal-cell.sel{background:linear-gradient(135deg,var(--g1),#5a8bff);color:#fff;font-weight:700;transform:scale(1.06)}
.cal-cell.blank{background:transparent;cursor:default}
.habit{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 15px;background:var(--card);border:1px solid var(--border);border-radius:13px;margin-bottom:10px;animation:pop .4s both}
.habit .st{font-size:.78rem;color:var(--muted)}
.flame{display:inline-block;animation:bob 2s infinite}
.hbtns{display:flex;gap:8px;align-items:center}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--border);background:transparent;cursor:pointer;font-size:.85rem;color:#fff;font-family:inherit;transition:all .2s}
.ck.on{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent}

/* cam */
.cam-wrap{display:flex;gap:20px;flex-wrap:wrap}
.cam-left{flex:1;min-width:260px}
.cam-video{width:100%;max-width:340px;border-radius:16px;border:1px solid var(--border);background:#000;aspect-ratio:4/3;object-fit:cover}
.mbar{height:16px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:10px 0}
.mbar div{height:100%;background:linear-gradient(90deg,var(--g2),var(--ok));border-radius:999px;transition:width .4s}
.stat-line{display:flex;justify-content:space-between;font-size:.82rem;padding:8px 0;border-bottom:1px dashed var(--border)}
.status-pill{padding:5px 14px;border-radius:999px;font-weight:700;font-size:.8rem;display:inline-block}
.st-on{background:rgba(105,219,124,.18);color:var(--ok)}.st-mid{background:rgba(77,171,247,.18);color:#4dabf7}.st-away{background:rgba(255,107,129,.16);color:var(--bad)}

/* chat */
.chat-box{height:420px;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.msg{max-width:78%;padding:11px 15px;border-radius:16px;font-size:.87rem;line-height:1.5;animation:pop .3s both;white-space:pre-wrap}
.msg.bot{background:var(--card);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:5px}
.msg.me{background:linear-gradient(120deg,var(--g1),#5a8bff);align-self:flex-end;border-bottom-right-radius:5px}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:4px;animation:dots 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
.chat-in{display:flex;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:.76rem;cursor:pointer;font-family:inherit;transition:all .2s}
.chip:hover{color:var(--text);transform:translateY(-2px)}

/* feedback */
.stars{display:flex;gap:6px;font-size:1.5rem;margin:6px 0 4px}
.stars button{background:none;border:none;cursor:pointer;font-size:1.5rem;filter:grayscale(1);transition:transform .15s,filter .15s;font-family:inherit}
.stars button.on{filter:none;transform:scale(1.15)}
.fb-card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:15px 17px;margin-bottom:12px;animation:pop .4s both}
.fb-card.reply{border-color:rgba(105,219,124,.5)}
.fb-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:.74rem;color:var(--muted)}
.reply-box{margin-top:10px;padding:11px 13px;border-left:3px solid var(--ok);background:rgba(105,219,124,.08);border-radius:999px;font-size:.84rem}

/* master */
.mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.mstat{padding:18px;animation:pop .5s both;animation-delay:var(--d)}
.mstat .num{font-size:1.9rem;font-weight:800}
.mstat .lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:9px;font-size:.8rem}
.bar-row .nm{width:170px;min-width:170px;color:var(--muted)}
.bar-row .bar{flex:1;height:13px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.bar-row .bar div{height:100%;border-radius:999px;width:0;transition:width 1s cubic-bezier(.4,0,.2,1)}
.bar-row .ct{width:26px;text-align:right;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.tbl th{text-align:left;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:1.5px;padding:99px 10px;border-bottom:1px solid var(--border)}
.tbl td{padding:10px;border-bottom:1px solid rgba(255,255,255,.06)}
.bchip-s{font-size:.68rem;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff}
.fixline{font-size:.82rem;padding:7px 10px;border-left:3px solid var(--ok);background:rgba(105,219,124,.07);border-radius:8px;margin-bottom:7px;animation:fixIn .4s both}

/* misc */
.empty{text-align:center;padding:50px 16px;color:var(--muted)}
.empty .emoji{font-size:2.6rem;display:block;margin-bottom:10px;animation:bob 2.5s infinite}
#toasts{position:fixed;right:20px;bottom:20px;z-index:99;display:flex;flex-direction:column;gap:10px}
.toast{background:#1a2140;border:1px solid var(--border);border-left:4px solid var(--g2);padding:13px 18px;border-radius:12px;
font-size:.84rem;box-shadow:var(--shadow);animation:toastIn .35s both;max-width:320px}
.toast.err{border-left-color:var(--bad)}
@media(max-width:900px){.dash{flex-direction:column}.side{width:100%;position:static}.side nav{flex-direction:row;flex-wrap:wrap}}
</style>
</head>
<body>
<div class="blob blob1"></div><div class="blob blob2"></div><div class="blob blob3"></div>
<div id="app"></div>
<div id="toasts"></div>

<script>
/* ================= UTILS & DB ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const todayStr=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m;};
const DB={
  get:(k,d)=>{try{const v=JSON.parse(localStorage.getItem("cm_"+k));return v===null||v===undefined?d:v}catch(e){return d}},
  set:(k,v)=>localStorage.setItem("cm_"+k,JSON.stringify(v))
};
function toast(msg,err){const t=document.createElement("div");t.className="toast"+(err?" err":"");t.textContent=msg;
  $("#toasts").appendChild(t);setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .4s";setTimeout(()=>t.remove(),400)},3400);}

/* ================= CONSTANTS ================= */
const BRANCHES=[
 {id:"mtcse",name:"M.Tech Integrated CSE",color:"#ff6b9d",room:"PG-CS",subs:["Advanced Algorithms","Machine Learning","Compiler Design","Big Data Analytics","Research Methodology","ML Lab"]},
 {id:"aitwin",name:"AI TWIN",color:"#a78bfa",room:"AI",subs:["Deep Learning","Neural Networks","Natural Language Processing","Reinforcement Learning","AI Ethics","DL Lab"]},
 {id:"csecore",name:"CSE CORE",color:"#38bdf8",room:"CS",subs:["Data Structures","Operating Systems","DBMS","Computer Networks","Theory of Computation","DS Lab"]},
 {id:"csetwin",name:"CSE TWIN",color:"#34d399",room:"CT",subs:["Data Structures","Software Engineering","DBMS","Web Technologies","Cloud Computing","Web Lab"]},
 {id:"mech",name:"Mechanical Engineering",color:"#fb923c",room:"ME",subs:["Thermodynamics","Fluid Mechanics","Machine Design","Heat Transfer","Manufacturing Processes","CAD Lab"]},
 {id:"ds",name:"CS Data Science",color:"#f472b6",room:"DS",subs:["Statistics","Data Mining","Python for DS","Data Visualization","Big Data","Analytics Lab"]},
 {id:"iot",name:"CS IOT",color:"#22d3ee",room:"IoT",subs:["Embedded Systems","Sensors & Actuators","IoT Protocols","Microcontrollers","Edge Computing","IoT Lab"]},
 {id:"bs",name:"CS BS",color:"#facc15",room:"BS",subs:["Discrete Mathematics","Probability","Linear Algebra","Optimization","Statistics","Computational Lab"]},
 {id:"ittwin",name:"IT TWIN",color:"#c084fc",room:"IT",subs:["Web Development","Network Security","Database Systems","Software Testing","UI/UX Design","Project Lab"]},
 {id:"csit",name:"CS IT",color:"#4ade80",room:"IT",subs:["Programming in C","Digital Logic","Computer Architecture","OOPs","Data Structures","IT Workshop"]}
];
const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const SLOTS=[["09:00","10:00"],["10:15","11:15"],
