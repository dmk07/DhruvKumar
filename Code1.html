<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#080b12" />
    <title>Studora — Academic Workspace</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
      :root {
        --bg: #080b12;
        --panel: #101722;
        --line: #263144;
        --text: #f3f5fa;
        --muted: #8995aa;
        --gold: #e7bd68;
        --blue: #477cff;
        --cyan: #4ed9ed;
        --green: #4bd2a0;
        --red: #ff7183;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(ellipse at 75% 0, #15264b66, transparent 38%),
          var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .wrap {
        width: min(1160px, calc(100% - 36px));
        margin: auto;
      }
      .brand {
        font: 800 19px Manrope;
        letter-spacing: -0.04em;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .mark {
        width: 31px;
        height: 31px;
        border-radius: 9px;
        background: linear-gradient(135deg, #ffdf91, #bc8835);
        color: #121722;
        display: grid;
        place-items: center;
      }
      .muted {
        color: var(--muted);
      }
      .gold {
        color: var(--gold);
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.17em;
        color: var(--gold);
        font-weight: 700;
      }
      .btn {
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 11px 15px;
        background: linear-gradient(135deg, #ffdf91, #c08b38);
        color: #141720;
        font-weight: 700;
        transition: 0.18s;
      }
      .btn:hover {
        transform: translateY(-2px);
        filter: brightness(1.07);
      }
      .btn.blue {
        background: linear-gradient(135deg, #477cff, #3354c5);
        color: white;
      }
      .btn.outline {
        background: #111824;
        border-color: var(--line);
        color: var(--text);
      }
      .btn.ghost {
        background: transparent;
        border: 0;
        color: var(--muted);
      }
      .btn.danger {
        background: #351923;
        color: #ff9baa;
      }
      .btn.sm {
        font-size: 11px;
        padding: 7px 10px;
      }
      .topbar {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #fff1;
      }
      .links,
      .actions {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .links a {
        color: #aab4c4;
        font-size: 12px;
        text-decoration: none;
      }
      .actions {
        gap: 9px;
      }
      .hero {
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        gap: 35px;
        align-items: center;
        padding: 65px 0;
      }
      .hero h1 {
        font: 800 clamp(40px, 6vw, 67px) / 1.03 Manrope;
        letter-spacing: -0.06em;
        margin: 15px 0;
      }
      .hero p {
        max-width: 480px;
        color: #a9b4c4;
        font-size: 15px;
        line-height: 1.7;
      }
      .hero-actions {
        display: flex;
        gap: 10px;
        margin: 25px 0 17px;
      }
      .mock {
        border: 1px solid #35435a;
        background: linear-gradient(145deg, #161e2c, #0c111a);
        border-radius: 14px;
        padding: 15px;
        box-shadow: 0 25px 70px #0009;
        position: relative;
      }
      .mockhead {
        display: flex;
        justify-content: space-between;
        padding: 4px 3px 13px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .mockgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding-top: 12px;
      }
      .mini {
        background: #111a28;
        border: 1px solid #28364a;
        border-radius: 9px;
        padding: 11px;
        font-size: 10px;
      }
      .mini h4 {
        font-size: 11px;
        margin: 0 0 9px;
      }
      .minirow {
        margin: 7px 0;
        padding: 7px;
        background: #17243a;
        border-left: 2px solid var(--gold);
        border-radius: 4px;
      }
      .wk {
        display: flex;
        gap: 4px;
      }
      .wk span {
        flex: 1;
        text-align: center;
        padding: 6px 2px;
        background: #17243a;
        border-radius: 5px;
        font-size: 9px;
      }
      .bar {
        height: 5px;
        background: #293449;
        border-radius: 5px;
        margin-top: 8px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--blue), var(--cyan));
        border-radius: 5px;
      }
      .float {
        position: absolute;
        padding: 10px 12px;
        background: #161f2d;
        border: 1px solid #39465a;
        border-radius: 8px;
        font-size: 10px;
        box-shadow: 0 15px 35px #0008;
        animation: up 4s infinite ease-in-out;
      }
      .float.a {
        right: -12px;
        top: 8%;
      }
      .float.b {
        left: -15px;
        bottom: 8%;
        animation-delay: -2s;
      }
      @keyframes up {
        50% {
          transform: translateY(-8px);
        }
      }
      section {
        padding: 65px 0;
        border-top: 1px solid #fff1;
      }
      .stitle {
        text-align: center;
        max-width: 620px;
        margin: 0 auto 32px;
      }
      .stitle h2 {
        font: 750 clamp(27px, 4vw, 40px) / 1.15 Manrope;
        letter-spacing: -0.045em;
        margin: 10px 0;
      }
      .stitle p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }
      .features {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 11px;
      }
      .feature,
      .step,
      .card {
        background: linear-gradient(145deg, #111925, #0c111a);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 17px;
      }
      .feature {
        min-height: 135px;
        transition: 0.2s;
      }
      .feature:hover {
        transform: translateY(-3px);
        border-color: #d4ae6177;
      }
      .feature .ico {
        color: var(--gold);
        font-size: 20px;
      }
      .feature h3 {
        font-size: 13px;
        margin: 13px 0 6px;
      }
      .feature p,
      .step p {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.55;
        margin: 0;
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .step {
        border-top: 1px solid var(--gold);
      }
      .step strong {
        font: 800 28px Manrope;
        color: var(--gold);
      }
      .step h3 {
        font-size: 13px;
      }
      .flow {
        display: grid;
        grid-template-columns: 1fr 55px 1fr;
        gap: 12px;
        align-items: center;
      }
      .scatter,
      .workspace {
        background: #0e1420;
        border: 1px dashed #38445a;
        border-radius: 12px;
        min-height: 180px;
        padding: 17px;
      }
      .scatter span {
        display: inline-block;
        margin: 8px;
        padding: 8px;
        background: #172133;
        border: 1px solid #2b374b;
        border-radius: 7px;
        font-size: 11px;
      }
      .workspace {
        border-style: solid;
      }
      .wrow {
        padding: 9px;
        border-bottom: 1px solid #252f40;
        font-size: 11px;
        display: flex;
        justify-content: space-between;
      }
      .arrow {
        text-align: center;
        color: var(--gold);
        font-size: 25px;
      }
      .chatdemo {
        max-width: 720px;
        margin: auto;
        padding: 20px;
      }
      .bubble {
        padding: 10px 13px;
        border-radius: 9px;
        background: #17243a;
        margin: 8px 0;
        font-size: 11px;
        line-height: 1.6;
        max-width: 82%;
      }
      .bubble.ai {
        margin-left: auto;
        background: #1b345d;
      }
      .cta {
        text-align: center;
        background: radial-gradient(
          ellipse at center,
          #17346855,
          transparent 70%
        );
      }
      .cta h2 {
        font: 800 36px Manrope;
      }
      .cta p,
      footer {
        color: var(--muted);
        font-size: 12px;
      }
      footer {
        border-top: 1px solid #fff1;
        padding: 25px 0;
      }
      footer .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .auth {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .authvisual {
        padding: 8vw;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: radial-gradient(ellipse at center, #19356766, transparent);
      }
      .authvisual h1 {
        font: 800 47px/1.08 Manrope;
        letter-spacing: -0.05em;
      }
      .authform {
        width: min(380px, 90%);
        margin: auto;
      }
      .authform h2 {
        font: 750 27px Manrope;
        margin: 10px 0;
      }
      .field {
        display: grid;
        gap: 6px;
        margin: 13px 0;
      }
      .field label {
        font-size: 11px;
        color: #abb5c5;
      }
      .input {
        background: #0b111b;
        color: white;
        border: 1px solid #2c3749;
        border-radius: 7px;
        padding: 11px;
        width: 100%;
        outline: 0;
      }
      .input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px #477cff22;
      }
      .authform .btn {
        width: 100%;
        margin-top: 8px;
      }
      .app {
        display: none;
      }
      .apphead {
        height: 62px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        position: sticky;
        top: 0;
        background: #090d15ee;
        border-bottom: 1px solid var(--line);
        z-index: 3;
      }
      .appgrid {
        display: grid;
        grid-template-columns: 205px 1fr;
        max-width: 1420px;
        margin: auto;
      }
      .side {
        height: calc(100vh - 62px);
        position: sticky;
        top: 62px;
        border-right: 1px solid var(--line);
        padding: 14px;
        display: flex;
        flex-direction: column;
      }
      .nav {
        background: transparent;
        border: 0;
        color: #9da8b9;
        text-align: left;
        padding: 10px;
        border-radius: 7px;
        font-size: 12px;
      }
      .nav:hover,
      .nav.on {
        background: #18233a;
        color: white;
        box-shadow: inset 2px 0 var(--gold);
      }
      .nav i {
        font-style: normal;
        color: var(--gold);
        margin-right: 9px;
      }
      .sidefoot {
        margin-top: auto;
      }
      .main {
        padding: 25px;
        min-width: 0;
      }
      .pagehead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 19px;
      }
      .pagehead h1 {
        font: 750 24px Manrope;
        margin: 5px 0;
      }
      .pagehead p {
        font-size: 11px;
        color: var(--muted);
        margin: 0;
      }
      .grid {
        display: grid;
        gap: 12px;
      }
      .stats {
        grid-template-columns: repeat(4, 1fr);
        margin-bottom: 13px;
      }
      .two {
        grid-template-columns: 1.1fr 0.9fr;
      }
      .three {
        grid-template-columns: repeat(3, 1fr);
      }
      .cardtitle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .cardtitle h3 {
        font: 700 13px Manrope;
        margin: 0;
      }
      .cardtitle small {
        color: var(--muted);
        font-size: 9px;
      }
      .value {
        font: 750 25px Manrope;
        margin: 8px 0 2px;
      }
      .statlabel {
        font-size: 9px;
        color: var(--muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 9px;
        border-bottom: 1px solid #fff1;
        padding: 9px 0;
        font-size: 11px;
      }
      .row:last-child {
        border: 0;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .row small {
        display: block;
        color: var(--muted);
        font-size: 9px;
        margin-top: 3px;
      }
      .tag {
        font-size: 9px;
        padding: 4px 7px;
        border-radius: 4px;
        background: #1b2b49;
        color: #b6caff;
      }
      .tag.goldtag {
        background: #352b19;
        color: #efd28c;
      }
      .tag.redtag {
        background: #391c25;
        color: #ff9baa;
      }
      .iconbtn {
        background: #111925;
        border: 1px solid var(--line);
        color: #abb4c4;
        border-radius: 6px;
        padding: 6px;
      }
      .empty {
        padding: 18px 5px;
        text-align: center;
        color: var(--muted);
        font-size: 11px;
      }
      .tablewrap {
        overflow: auto;
      }
      .table {
        border-collapse: collapse;
        width: 100%;
        min-width: 520px;
        font-size: 10px;
      }
      .table th,
      .table td {
        text-align: left;
        padding: 10px;
        border-bottom: 1px solid #fff1;
      }
      .table th {
        color: var(--muted);
        font-size: 9px;
      }
      .table input,
      .table select {
        background: #0b111b;
        color: white;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 5px;
        font-size: 10px;
      }
      .calendar {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        border-left: 1px solid var(--line);
        border-top: 1px solid var(--line);
      }
      .calhead,
      .calday {
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 7px;
        min-height: 74px;
      }
      .calhead {
        min-height: auto;
        font-size: 9px;
        color: var(--muted);
      }
      .calday {
        font-size: 10px;
        cursor: pointer;
      }
      .calday:hover,
      .calday.today {
        background: #17233a;
      }
      .event {
        display: block;
        margin-top: 4px;
        padding: 3px;
        background: #182947;
        border-left: 2px solid var(--blue);
        font-size: 8px;
        white-space: nowrap;
        overflow: hidden;
      }
      .classrow {
        display: grid;
        grid-template-columns: 90px 1fr auto;
        gap: 9px;
        align-items: center;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 7px;
        margin: 7px 0;
        background: #111925;
      }
      .clock {
        color: var(--gold);
        font-size: 10px;
      }
      .chatpanel {
        height: min(520px, 65vh);
        display: flex;
        flex-direction: column;
      }
      .messages {
        flex: 1;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 9px;
        padding: 8px;
      }
      .msg {
        max-width: 80%;
        background: #17243a;
        padding: 10px 12px;
        border-radius: 9px;
        font-size: 11px;
        line-height: 1.6;
        white-space: pre-line;
      }
      .msg.me {
        align-self: flex-end;
        background: #203a68;
      }
      .compose {
        display: flex;
        gap: 7px;
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }
      .compose input {
        flex: 1;
      }
      .prompts {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 9px 0;
      }
      .prompt {
        font-size: 9px;
        background: #121d2d;
        color: #bbc6d7;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 7px;
      }
      .notice {
        background: #111c2b;
        padding: 10px;
        border-radius: 7px;
        color: #9eacc1;
        font-size: 10px;
        line-height: 1.55;
        margin-top: 10px;
      }
      .drop {
        padding: 22px;
        text-align: center;
        border: 1px dashed #43516b;
        border-radius: 8px;
        background: #101827;
      }
      .drop label {
        color: var(--gold);
        cursor: pointer;
      }
      .drop input {
        display: none;
      }
      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        background: #1a2940;
        border: 1px solid #445576;
        padding: 12px 15px;
        border-radius: 8px;
        font-size: 11px;
        z-index: 9;
      }
      .modalbg {
        position: fixed;
        inset: 0;
        background: #000b;
        display: grid;
        place-items: center;
        padding: 15px;
        z-index: 8;
      }
      .modal {
        width: min(460px, 100%);
        background: #101722;
        border: 1px solid #39465d;
        border-radius: 10px;
        padding: 20px;
      }
      .modal h3 {
        font: 700 16px Manrope;
        margin: 0 0 12px;
      }
      @media (max-width: 850px) {
        .hero {
          grid-template-columns: 1fr;
        }
        .features {
          grid-template-columns: repeat(2, 1fr);
        }
        .steps {
          grid-template-columns: repeat(2, 1fr);
        }
        .auth {
          grid-template-columns: 1fr;
        }
        .authvisual {
          display: none;
        }
        .appgrid {
          grid-template-columns: 64px 1fr;
        }
        .side {
          padding: 10px 6px;
        }
        .nav {
          font-size: 0;
          text-align: center;
        }
        .nav i {
          font-size: 16px;
          margin: 0;
        }
        .sidefoot {
          display: none;
        }
        .two {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 580px) {
        .wrap {
          width: calc(100% - 28px);
        }
        .links {
          display: none;
        }
        .hero {
          padding: 44px 0;
        }
        .hero h1 {
          font-size: 42px;
        }
        .float {
          font-size: 8px;
        }
        .features {
          gap: 7px;
        }
        .feature {
          padding: 12px;
          min-height: 128px;
        }
        .flow {
          grid-template-columns: 1fr;
        }
        .arrow {
          transform: rotate(90deg);
        }
        section {
          padding: 48px 0;
        }
        .apphead {
          padding: 0 11px;
        }
        .appgrid {
          display: block;
        }
        .side {
          height: auto;
          position: sticky;
          top: 62px;
          z-index: 4;
          flex-direction: row;
          overflow: auto;
          border: 0;
          border-bottom: 1px solid var(--line);
          background: #090d15;
          padding: 6px;
        }
        .nav {
          flex: 0 0 38px;
        }
        .main {
          padding: 15px 10px;
        }
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
        .three {
          grid-template-columns: 1fr;
        }
        .pagehead h1 {
          font-size: 20px;
        }
        .pagehead {
          align-items: flex-start;
        }
        .calhead,
        .calday {
          padding: 4px;
          min-height: 57px;
        }
        .calhead {
          font-size: 8px;
        }
        .event {
          font-size: 7px;
        }
        .classrow {
          grid-template-columns: 60px 1fr;
        }
        .classrow .right {
          grid-column: 2;
        }
        .cta h2 {
          font-size: 29px;
        }
      }
    </style>
  </head>
  <body>
    <main id="landing"></main>
    <main id="auth" style="display: none"></main>
    <main id="app" class="app"></main>
    <div id="toast"></div>
    <div id="modal"></div>
    <script>
      const $ = (s) => document.querySelector(s),
        $$ = (s) => [...document.querySelectorAll(s)],
        esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
      const storeKey = "studora-workspace-v3";
      let state = {};
      try {
        state = JSON.parse(localStorage.getItem(storeKey)) || {};
      } catch {}
      state.users ||= {};
      state.session ||= null;
      const save = () => localStorage.setItem(storeKey, JSON.stringify(state)),
        today = () => new Date().toISOString().slice(0, 10),
        uid = () => Math.random().toString(36).slice(2, 10),
        days = [
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday",
          "Sunday",
        ];
      let active = "home",
        cal = new Date();
      const user = () => state.users[state.session] || null;
      function profile() {
        let u = user();
        if (!u) return null;
        return (u.data ||= {

      async function scanFile(file) {
        if (!file) return;
        let status = $("#scanStatus");
        status.textContent = "Preparing file…";
        try {
          if (!window.Tesseract)
            throw Error(
              "OCR library unavailable. Check your internet connection and reload.",
            );
          let image = file;
          if (file.type === "application/pdf") {
            if (!window.pdfjsLib)
              throw Error(
                "PDF reader unavailable. Check your internet connection and reload.",
              );
            pdfjsLib.GlobalWorkerOptions.workerSrc =
              "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
            let pdf = await pdfjsLib.getDocument({
                data: await file.arrayBuffer(),
              }).promise,
              page = await pdf.getPage(1),
              vp = page.getViewport({ scale: 2 }),
              canvas = document.createElement("canvas");
            canvas.width = vp.width;
            canvas.height = vp.height;
            await page.render({
              canvasContext: canvas.getContext("2d"),
              viewport: vp,
            }).promise;
            image = canvas;
          }
          status.textContent =
            "Reading timetable… first scan may take a minute.";
          let worker = await Tesseract.createWorker("eng", 1, {
              logger: (m) => {
                if (m.status === "recognizing text")
                  status.textContent = `Reading timetable… ${Math.round(m.progress * 100)}%`;
              },
            }),
            result;
          try {
            result = await worker.recognize(image);
          } finally {
            await worker.terminate();
          }
          let parsed = parseOCR(result.data.text, result.data.words);
          if (!parsed.length) {
            $("#scanResults").innerHTML =
              `<div class="notice">Text was detected, but no day/time rows could be matched. Try a clearer image, or add periods manually.<details><summary>OCR text</summary><pre style="white-space:pre-wrap">${esc(result.data.text)}</pre></details></div>`;
            status.textContent = "Scan complete · no period rows found";
            return;
          }
          let p = profile(),
            added = 0;
          for (let c of parsed)
            if (
              !p.schedule.some(
                (x) =>
                  x.day === c.day &&
                  x.start === c.start &&
                  x.subject.toLowerCase() === c.subject.toLowerCase(),
              )
            ) {
              p.schedule.push({ id: uid(), ...c });
              added++;
            }
          save();
          status.textContent = `Scan complete · ${added} periods added`;
          $("#scanResults").innerHTML =
            `<div class="notice" style="color:var(--green)">✓ Imported ${added} periods. Check the weekly timetable and correct any OCR errors.</div>${parsed.map((c) => `<div class="row"><span class="gold">${esc(c.day)} ${esc(c.start)}</span><b class="grow">${esc(c.subject)}</b></div>`).join("")}`;
        } catch (err) {
          status.textContent = "Scan failed";
          $("#scanResults").innerHTML =
            `<div class="notice" style="color:var(--red)">${esc(err.message)}</div>`;
        }
      }
      function parseOCR(text, words = []) {
        let out = [],
          lines = text
            .split(/\n+/)
            .map((x) => x.replace(/[|]/g, " ").replace(/\s+/g, " ").trim())
            .filter(Boolean),
          map = {
            mon: "Monday",
            monday: "Monday",
            tue: "Tuesday",
            tues: "Tuesday",
            tuesday: "Tuesday",
            wed: "Wednesday",
            wednesday: "Wednesday",
            thu: "Thursday",
            thur: "Thursday",
            thurs: "Thursday",
            thursday: "Thursday",
            fri: "Friday",
            friday: "Friday",
            sat: "Saturday",
            saturday: "Saturday",
            sun: "Sunday",
            sunday: "Sunday",
          },
          range =
            /\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|to)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i,
          fmt = (h, mi, ap) => {
            h = +h;
            mi = mi || "00";
            if (ap) {
              ap = ap.toLowerCase();
              if (ap === "pm" && h < 12) h += 12;
              if (ap === "am" && h === 12) h = 0;
            }
            return String(h).padStart(2, "0") + ":" + mi;
          };
        for (let line of lines) {
          let day = Object.entries(map).find(([k]) =>
              new RegExp("\\b" + k + "\\b", "i").test(line),
            )?.[1],
            m = line.match(range);
          if (!day || !m) continue;
          let subject = line
            .replace(m[0], " ")
            .replace(new RegExp(day, "i"), " ")
            .replace(/\b(room|teacher|classroom)\b/gi, " ")
            .replace(/\s+/g, " ")
            .replace(/^[\s:,-]+|[\s:,-]+$/g, "");
          if (subject.length > 1)
            out.push({
              day,
              start: fmt(m[1], m[2], m[3]),
              end: fmt(m[4], m[5], m[6]),
              subject: subject.slice(0, 80),
              room: "",
            });
        }
        if (out.length || !words.length) return out;
        let dayWords = words
          .map((w) => ({
            w,
            t: (w.text || "").toLowerCase().replace(/[^a-z]/g, ""),
            x: (w.bbox.x0 + w.bbox.x1) / 2,
            y: (w.bbox.y0 + w.bbox.y1) / 2,
          }))
          .filter((o) => map[o.t])
          .map((o) => ({ day: map[o.t], x: o.x, y: o.y }));
        let groups = [];
        for (let w of words.filter((w) => w.text && w.bbox)) {
          let y = (w.bbox.y0 + w.bbox.y1) / 2,
            g = groups.find((g) => Math.abs(g.y - y) < 12);
          if (!g) groups.push((g = { y, words: [] }));
          g.words.push(w);
        }
        groups.forEach((g) => {
          g.words.sort((a, b) => a.bbox.x0 - b.bbox.x0);
          g.text = g.words
            .map((w) => w.text)
            .join(" ")
            .replace(/\s+/g, " ")
            .trim();
          g.x = (g.words[0].bbox.x0 + g.words[g.words.length - 1].bbox.x1) / 2;
          g.range = g.text.match(range);
        });
        let times = groups
            .filter((g) => g.range)
            .map((g) => {
              let m = g.range;
              return {
                y: g.y,
                start: fmt(m[1], m[2], m[3]),
                end: fmt(m[4], m[5], m[6]),
              };
            }),
          headers = dayWords.filter(
            (d) => !times.some((t) => Math.abs(t.y - d.y) < 20),
          );
        for (let g of groups) {
          if (
            g.range ||
            !g.text ||
            g.text.length < 3 ||
            /^(mon|tue|wed|thu|fri|sat|sun)(day)?$/i.test(g.text)
          )
            continue;
          let dh = headers
              .slice()
              .sort((a, b) => Math.abs(a.x - g.x) - Math.abs(b.x - g.x))[0],
            tm = times
              .slice()
              .sort((a, b) => Math.abs(a.y - g.y) - Math.abs(b.y))[0];
          if (!dh || !tm || Math.abs(tm.y - g.y) > 48) continue;
          let subject = g.text
            .replace(/\b(room|teacher|classroom)\b/gi, "")
            .replace(/[^\p{L}\p{N}&. -]/gu, "")
            .trim();
          if (
            subject.length > 2 &&
            !out.some(
              (c) =>
                c.day === dh.day &&
                c.start === tm.start &&
                c.subject === subject,
            )
          )
            out.push({
              day: dh.day,
              start: tm.start,
              end: tm.end,
              subject: subject.slice(0, 80),
              room: "",
            });
        }
        return out;
      }

      function assistantPage() {
        return `${head("AI student assistant", "Ask about your schedule, tasks and academic goals.")}<article class="card chatpanel"><div id="messages" class="messages"><div class="msg">Hi ${esc(profile().name.split(" ")[0])} — I can help with your classes, deadlines, attendance and CGPA. What are you working on?</div></div><div class="prompts">${["What do I need to finish today?", "What classes do I have tomorrow?", "Which tasks are due this week?", "Which task should I prioritize?", "How is my attendance?", "What is my CGPA?"].map((q) => `<button class="prompt" onclick="ask(${JSON.stringify(q)})">${q}</button>`).join("")}</div><form class="compose" id="chatForm"><input id="chatInput" class="input" placeholder="Ask about your academic plan…"><button class="btn">Send ↗</button></form></article><div class="notice">This demo assistant answers from your saved workspace using local rules. It does not send your data to an AI service.</div>`;

      function ask(q) {
        let box = $("#messages");

        let m = document.createElement("div");
        m.className = "msg me";

      function answer(q) {
        let p = profile(),
          s = q.toLowerCase(),
          tasks = p.tasks
            .filter((t) => !t.done)
            .sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
        if (/class|timetable|tomorrow|schedule/.test(s)) {
          let d =
              days[
                (new Date().getDay() + (/tomorrow/.test(s) ? 1 : 0) + 6) % 7
              ],
            list = p.schedule
              .filter((c) => c.day === d)
              .sort((a, b) => a.start.localeCompare(b.start));
          return list.length
            ? `${d}:\n${list.map((c) => `${c.start}–${c.end} · ${c.subject}${c.room ? " · " + c.room : ""}`).join("\n")}`
            : `No ${d} classes are saved. Scan or add your timetable first.`;

        if (/attendance/.test(s)) {

        if (/cgpa|gpa|goal/.test(s)) {
          let c = cgpa(p);
          return c === null
            ? `Your CGPA goal is ${p.target}. Add semester results to calculate your standing.`
            : `Your current CGPA is ${c.toFixed(2)} / 10. Your goal is ${p.target}.`;
        }
        if (/week|due|assignment|task|finish|priorit/.test(s)) {
          if (!tasks.length)
            return "No open tasks saved. Add assignments or study tasks and I can help you prioritize.";
          let w = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10),
            ls = /week/.test(s)
              ? tasks.filter((t) => !t.due || t.due <= w)
              : tasks;
          return `Your next priorities:\n${ls
            .slice(0, 5)
            .map(
              (t, i) =>
                `${i + 1}. ${t.title}${t.due ? " · " + dateText(t.due) : ""} · ${t.priority}`,
            )
            .join("\n")}`;
        }
        if (/remind/.test(s))
          return `Your reminder preference is ${p.reminder || 30} minutes before class. Browser alerts are not scheduled in this demo.`;
        return "Ask me about classes, tasks due this week, attendance, CGPA, or which task to prioritize.";
      }
      function settingsPage() {
        let p = profile();
        return `${head("Academic profile", "Your details and reminder preferences.")}<article class="card" style="max-width:650px"><form id="profileForm"><div class="field"><label>Name</label><input class="input" name="name" value="${esc(p.name)}"></div><div class="field"><label>College / school</label><input class="input" name="college" value="${esc(p.college)}"></div><div class="grid two"><div class="field"><label>Course</label><input class="input" name="course" value="${esc(p.course)}"></div><div class="field"><label>Semester / year</label><input class="input" name="semester" value="${esc(p.semester)}"></div></div><div class="field"><label>Reminder preference</label><select class="input" name="reminder">${[
          [10, "10 minutes"],
          [30, "30 minutes"],
          [60, "1 hour"],
          [1440, "1 day"],
        ]
          .map(
            ([n, s]) =>
              `<option value="${n}" ${p.reminder == n ? "selected" : ""}>${s} before class</option>`,
          )
          .join(
            "",
          )}</select></div><button class="btn">Save profile</button></form><div class="notice">Account and academic data stay in this browser. Cloud sync and push notifications are not connected in this demo.</div></article>`;
      }
      function renderApp() {
        if (!user()) return landing();
        $("#landing").style.display = "none";
        $("#auth").style.display = "none";
        $("#app").style.display = "block";
        $("#app").innerHTML =
          `<header class="apphead">${brand}<div style="display:flex;align-items:center;gap:10px"><small class="muted">${esc(profile().college || "My workspace")}</small><button class="iconbtn" onclick="logout()">Log out ↗</button></div></header><div class="appgrid"><aside class="side"><div class="eyebrow" style="padding:9px">WORKSPACE</div>${nav.map((n) => `<button class="nav ${active === n[0] ? "on" : ""}" onclick="go('${n[0]}')"><i>${n[1]}</i>${n[2]}</button>`).join("")}<div class="sidefoot"><button class="nav" onclick="go('settings')"><i>⚙</i>Profile & settings</button></div></aside><section class="main" id="content"></section></div>`;
        let views = {
          home: homePage,
          timetable: timetablePage,
          tasks: tasksPage,
          calendar: calendarPage,
          attendance: attendancePage,
          cgpa: cgpaPage,
          assistant: assistantPage,
          settings: settingsPage,
        };
        $("#content").innerHTML = (views[active] || homePage)();
        let cf = $("#chatForm");
        if (cf)
          cf.onsubmit = (e) => {
            e.preventDefault();
            let i = $("#chatInput"),
              q = i.value.trim();
            if (q) {
              i.value = "";
              ask(q);
            }
          };
        let pf = $("#profileForm");
        if (pf)
          pf.onsubmit = (e) => {
            e.preventDefault();
            let f = new FormData(pf),
              p = profile();
            p.name = f.get("name").trim() || "Student";
            p.college = f.get("college").trim();
            p.course = f.get("course").trim();
            p.semester = f.get("semester").trim();
            p.reminder = +f.get("reminder");
            save();
            toast("Profile saved");
            renderApp();
          };
      }
      if (user()) openApp();
      else landing();
    </script>
  </body>
</html>
